<!DOCTYPE html>
<html lang="en-IN" data-density="compact">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-pxjxTOjo0CWpiuPMAUKDep8TrQXkB6hT72JrfMPKjSo=' 'sha256-rTp2EVzbkrMHQF/Jjy5Hl8FsiGhjp9W+748azZZB3RI='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TaxPlot for CAs</title>
<meta name="theme-color" content="#00657E">
<link rel="icon" href="apple-touch-icon.png">
<script>
(function(){try{var s=JSON.parse(localStorage.getItem("taxplot.ca.settings")||"{}"),r=document.documentElement;
if(s.theme==="light"||s.theme==="dark")r.dataset.theme=s.theme;
if(s.density==="comfortable")delete r.dataset.density;
if(s.text==="large")r.dataset.text="large";}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400..800&family=Mukta:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css?v=v5">
</head>
<body class="ca">
<header class="top">
  <div class="logo"><span class="mark">T</span>TaxPlot <small>for CAs</small></div>
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
    <input id="q" type="search" placeholder="Search clients, PAN" aria-label="Search">
    <kbd>/</kbd>
  </label>
  <select id="fy" aria-label="Financial year"></select>
  <div class="sp">
    <button class="tbtn" type="button" id="theme-quick" aria-label="Switch theme"></button>
    <span class="avatar" title="Example CA user">RM</span>
  </div>
</header>

<div class="work">
  <nav class="rail" aria-label="Workspace" id="rail"></nav>
  <div class="content" id="content"></div>
</div>

<footer class="statusbar" id="statusbar"></footer>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
/* Preload locale JSON with fetch() so the service worker's cache serves it offline (a sync XHR was not reliably served from the SW cache, issue #28), then load the app scripts in order. loadLocale() in locales/i18n.js uses window.__TP_LOCALES when present and falls back to its sync XHR. */
(function () {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {}); /* same worker as the consumer app: lets the CA workspace load offline too */
  var V = "v11"; /* keep equal to CACHE_VERSION in sw.js: bump both each release so scripts bypass the 10-minute HTTP cache */
  var L = window.__TP_LOCALES = {}; window.__TP_V = V;
  function add(src) { return new Promise(function (ok, no) { var s = document.createElement("script"); s.src = src + "?v=" + V; s.onload = ok; s.onerror = no; document.body.appendChild(s); }); }
  Promise.all(["locales/en.json", "locales/glossary.en.json"].map(function (f) {
    return fetch(f + "?v=" + V).then(function (r) { if (!r.ok) throw new Error(f); return r.text(); }).then(function (t) { JSON.parse(t); L[f] = t; }).catch(function () {});
  })).then(function () { return add("tax-engine.js"); }).then(function () { return add("locales/i18n.js"); }).then(function () { return add("ca.js"); });
})();
</script>
</body>
</html>
